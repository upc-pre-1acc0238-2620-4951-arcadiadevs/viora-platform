# Perfil de demostracion (SPRING_PROFILES_ACTIVE=demo).
#
# ATENCION: estos valores son SINTETICOS. Existen solo para mostrar el flujo completo de la prescripcion de
# aclareo en una demostracion; no son datos agronomicos, no los aprobo ningun tecnico y no deben usarse en
# produccion. Los perfiles reales los debe aportar un tecnico (ver docs/adr/ADR-004).
#
# Por cada variedad: carga objetivo en frutos por brote y ventana en dias despues de la plena floracion.

