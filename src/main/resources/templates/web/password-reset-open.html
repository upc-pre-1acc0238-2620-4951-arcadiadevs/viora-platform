<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light only">
  <meta name="robots" content="noindex">
  <title>Crear nueva contraseña · Viora</title>
  <style>
    body { margin: 0; background: #F9F6F1; color: #1B1916; font-family: Roboto, "Segoe UI", Arial, sans-serif; }
    main { max-width: 420px; margin: 0 auto; padding: 48px 24px 32px; text-align: center; }
    .logo { display: block; margin: 0 auto 28px; }
    .sprig { display: block; margin: 0 auto 16px; }
    .eyebrow { font-size: 11px; letter-spacing: 1.5px; color: #5C5A57; text-transform: uppercase; }
    .eyebrow::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: #2E4A3A; margin-right: 8px; vertical-align: middle; }
    h1 { font-family: Newsreader, Georgia, "Times New Roman", serif; font-weight: 400; font-size: 36px;
      line-height: 40px; margin: 12px 0 16px; }
    h1 em { font-style: italic; }
    p { font-size: 15px; line-height: 22px; color: #413F3C; margin: 0 0 28px; }
    .button { display: block; background: #1F2C26; color: #F3F0EA; text-decoration: none; border-radius: 999px;
      padding: 18px 24px; font-size: 16px; font-weight: 500; }
    .note { font-size: 13px; line-height: 19px; color: #5C5A57; margin-top: 24px; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/email/viora-logo.png" width="132" height="40" alt="Viora">
    <img class="sprig" src="/email/olive-sprig.gif" width="168" height="132" alt="">
    <div class="eyebrow">Contraseña nueva</div>
    <h1>Abre Viora para<br><em>continuar.</em></h1>
    <p>Este enlace crea tu nueva contraseña dentro de la app. Tócalo desde el celular donde tienes Viora instalada.</p>
    <a class="button" id="open" href="{{intentUrl}}">Abrir en la app</a>
    <div class="note">El enlace sirve una sola vez y vence a los 30 minutos. Si ya venció, pide uno nuevo desde «¿Olvidaste tu contraseña?».</div>
  </main>
  <script>
    // Android opens the app straight away when it can; otherwise the button above does it on a tap.
    if (/Android/i.test(navigator.userAgent)) { window.location.replace(document.getElementById('open').href); }
  </script>
</body>
</html>
