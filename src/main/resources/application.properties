spring.application.name=viora-platform

# CORS Configuration
web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Physical Naming Strategy
spring.jpa.hibernate.naming.physical-strategy=com.arcadiadevs.viora.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCasePhysicalNamingStrategy

# DataSource Configuration (defaults to H2 in-memory when no external DB is configured)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:vioradb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS orchard\\;CREATE SCHEMA IF NOT EXISTS telemetry\\;CREATE SCHEMA IF NOT EXISTS phenology}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# H2 Console (accessible at /h2-console when running with embedded database)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# API Documentation Properties
documentation.application.title=Viora Agronomic Platform API
documentation.application.description=REST API for Viora agronomic monitoring and management platform
documentation.application.version=1.0.0

# SpringDoc OpenAPI Routing & UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
