# Tests never call the weather service from the scheduled winter warmth monitor
viora.phenology.warm-winter-monitor.enabled=false

# Tests never run the scheduled IAM cleanup
viora.iam.cleanup.enabled=false

# Tests sign tokens with a fixed secret; production reads JWT_SECRET, which has no default
authorization.jwt.secret=test-only-jwt-secret-that-is-long-enough-for-hmac-sha256

# Tests never send real emails, even when a developer's .env enables Brevo
viora.brevo.enabled=false

# Many tests sign in and sign up from the same address and email; the limits have their own tests
viora.iam.rate-limit.max-requests-per-address=100000
viora.iam.sign-in.max-failed-attempts=100000
viora.iam.password-reset.max-requests=100000
viora.subscription.redemption.max-requests-per-address=100000

# Tests run offline: the forecast falls back to its simulation, and the frost monitor never runs on its own
viora.telemetry.forecast.simulated-fallback=true
viora.telemetry.frost-monitor.enabled=false
viora.telemetry.retention.enabled=false

# Most tests create plots without dealing with plans; the plan and its hectares have their own tests
viora.orchard.plot-quota.enforced=false

# Tests never call a model: answers come from the templates and no API key is read, even from a developer's .env.
# The model writer has its own tests with a fake chat model.
viora.assistant.provider=template
spring.ai.model.chat=none
spring.ai.openai.api-key=
